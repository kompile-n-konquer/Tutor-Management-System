services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tms-local-mssql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Tutor-pass"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  mssql-data:
