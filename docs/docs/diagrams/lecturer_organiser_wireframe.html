<div style="background:var(--surface-1);border-radius:12px;padding:1rem;">
<div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;overflow:hidden;">

<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:0.5px solid var(--border);">
<div style="display:flex;align-items:center;gap:10px;">
<div style="width:28px;height:28px;border-radius:50%;background:var(--bg-accent);"></div>
<span style="font-size:14px;font-weight:500;">Tutor management — lecturer view</span>
</div>
<div style="display:flex;align-items:center;gap:12px;font-size:13px;color:var(--text-secondary);">
<span>Dr. N. Skhosana</span>
<i class="ti ti-logout" aria-hidden="true" style="font-size:16px;"></i>
</div>
</div>

<div style="display:flex;">
<div style="width:150px;border-right:0.5px solid var(--border);padding:12px 8px;display:flex;flex-direction:column;gap:2px;">
<div style="padding:8px 10px;border-radius:var(--radius);background:var(--fill-ghost-selected);font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;"><i class="ti ti-clipboard-check" aria-hidden="true" style="font-size:16px;"></i>Applications</div>
<div style="padding:8px 10px;border-radius:var(--radius);font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:8px;"><i class="ti ti-users" aria-hidden="true" style="font-size:16px;"></i>Manage tutors</div>
<div style="padding:8px 10px;border-radius:var(--radius);font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:8px;"><i class="ti ti-book" aria-hidden="true" style="font-size:16px;"></i>My courses</div>
<div style="padding:8px 10px;border-radius:var(--radius);font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:8px;"><i class="ti ti-file-invoice" aria-hidden="true" style="font-size:16px;"></i>Timesheets</div>
</div>

<div style="flex:1;padding:16px;">
<p style="font-size:15px;font-weight:500;margin:0 0 12px;">Applications — COMS3011A</p>

<div style="display:flex;gap:8px;margin-bottom:12px;">
<select style="width:auto;font-size:13px;"><option>Sort: mark (high to low)</option></select>
<select style="width:auto;font-size:13px;"><option>Filter: pending</option></select>
</div>

<div style="display:flex;flex-direction:column;">
<div style="display:grid;grid-template-columns:2fr 1fr 1fr 1.4fr;padding:8px 10px;font-size:12px;color:var(--text-muted);border-bottom:0.5px solid var(--border);">
<span>Applicant</span><span>Mark</span><span>Status</span><span></span>
</div>

<div style="display:grid;grid-template-columns:2fr 1fr 1fr 1.4fr;align-items:center;padding:10px;border-bottom:0.5px solid var(--border);font-size:13px;">
<span>T. Sebaeng</span><span>82%</span>
<span style="background:var(--bg-success);color:var(--text-success);font-size:12px;padding:2px 8px;border-radius:var(--radius);width:fit-content;">Accepted</span>
<span></span>
</div>

<div style="display:grid;grid-template-columns:2fr 1fr 1fr 1.4fr;align-items:center;padding:10px;border-bottom:0.5px solid var(--border);font-size:13px;">
<span>N. Mulaudzi</span><span>76%</span>
<span style="background:var(--bg-warning);color:var(--text-warning);font-size:12px;padding:2px 8px;border-radius:var(--radius);width:fit-content;">Waitlisted</span>
<span></span>
</div>

<div style="display:grid;grid-template-columns:2fr 1fr 1fr 1.4fr;align-items:center;padding:10px;font-size:13px;">
<span>K. Mohlala</span><span>68%</span>
<span style="background:var(--bg-accent-muted);color:var(--text-accent);font-size:12px;padding:2px 8px;border-radius:var(--radius);width:fit-content;">Pending</span>
<div style="display:flex;gap:6px;">
<button style="padding:4px 10px;font-size:12px;">Approve</button>
<button style="padding:4px 10px;font-size:12px;">Reject</button>
</div>
</div>
</div>

<div style="margin-top:14px;display:flex;align-items:center;gap:8px;background:var(--bg-danger);border-radius:var(--radius);padding:8px 10px;">
<i class="ti ti-alert-triangle" aria-hidden="true" style="font-size:16px;color:var(--text-danger);"></i>
<span style="font-size:12px;color:var(--text-danger);">Clashes with tutor's existing slot — resolve before assigning.</span>
</div>
</div>
</div>
</div>
</div>
