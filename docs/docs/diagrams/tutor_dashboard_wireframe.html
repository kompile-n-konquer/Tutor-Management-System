<div style="background:var(--surface-1);border-radius:12px;padding:1rem;">
<div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;overflow:hidden;">

<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:0.5px solid var(--border);">
<span style="font-size:14px;font-weight:500;">Tutor management — tutor view</span>
<div style="display:flex;align-items:center;gap:12px;font-size:13px;color:var(--text-secondary);">
<span>K. Mohlala</span>
<i class="ti ti-logout" aria-hidden="true" style="font-size:16px;"></i>
</div>
</div>

<div style="padding:16px;">
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;">
<div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem;">
<p style="font-size:13px;color:var(--text-secondary);margin:0 0 6px;">Hours this week</p>
<p style="font-size:24px;font-weight:500;margin:0;">6 / 10</p>
</div>
<div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem;">
<p style="font-size:13px;color:var(--text-secondary);margin:0 0 6px;">Timesheet status</p>
<p style="font-size:15px;font-weight:500;margin:0;color:var(--text-warning);">Draft</p>
</div>
<div style="background:var(--surface-1);border-radius:var(--radius);padding:1rem;">
<p style="font-size:13px;color:var(--text-secondary);margin:0 0 6px;">Next session</p>
<p style="font-size:15px;font-weight:500;margin:0;">Tue, 14:00</p>
</div>
</div>

<p style="font-size:15px;font-weight:500;margin:0 0 10px;">Logbook</p>
<div style="display:flex;flex-direction:column;margin-bottom:14px;">
<div style="display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;padding:8px 10px;font-size:12px;color:var(--text-muted);border-bottom:0.5px solid var(--border);">
<span>Course</span><span>Date</span><span>Hours</span><span>Approved</span>
</div>
<div style="display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;align-items:center;padding:10px;border-bottom:0.5px solid var(--border);font-size:13px;">
<span>COMS3011A</span><span>18 Aug</span><span>2.0</span>
<span style="background:var(--bg-success);color:var(--text-success);font-size:12px;padding:2px 8px;border-radius:var(--radius);width:fit-content;">Yes</span>
</div>
<div style="display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;align-items:center;padding:10px;font-size:13px;">
<span>COMS3011A</span><span>20 Aug</span><span>2.0</span>
<span style="background:var(--bg-accent-muted);color:var(--text-accent);font-size:12px;padding:2px 8px;border-radius:var(--radius);width:fit-content;">Pending</span>
</div>
</div>

<div style="display:flex;gap:8px;">
<button>Log hours</button>
<button>Submit timesheet</button>
<button style="color:var(--text-danger);">Excuse myself</button>
</div>
</div>
</div>
</div>
